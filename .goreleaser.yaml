version: 2

project_name: helpnet

builds:
  - main: ./cmd/helpnet
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - docs/config.example.toml
      - docs/report-schema.json

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
